<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />

		<title>가위바위보 게임</title>

		<style>
			body {
				width: 50%;
				max-width: 800px;
				min-width: 480px;
				margin: 0 auto;
			}
			.form{
				display: flex;
				justify-content: flex-start;
				align-items: center;
				width: 100%;
			}
			.wrapper {
				position:relative; 
			}
			input{
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				opacity: 0;
				appearance: none;
				-webkit-appearance: none;
				outline: none;
			}
			label {
				display: block;
				width: 100px;
				height: 25px;
				line-height: 23px; 
				margin-right: 4px;
				border: 1px solid #767676; 
				border-radius: 2px; 
				background: #efefef;
				font-size: 13px;
				text-align: center; 
				box-sizing: border-box;
			}
		</style>
	</head>

	<body>
		<h1>가위바위보 게임</h1>

		<li style="margin-bottom: 5px">
			게임시작을 누르면 랜덤값으로 가위,바위,보중 하나가 지정됩니다.
		</li>
		<li style="margin-bottom: 15px">
			유저도 가위,바위,보중에 하나를 선택하고 결과를 확인합니다.
		</li>
		<div class="setDigitForm">
			<button
				class="setPrsSubmit"
				style="width: 310px"
			>
			게임시작
			</button>
		</div>

		<div class="form" style="margin-top: 40px">
			<div class="wrapper">
				<input
					type="button"
					id="btnScissors"
					value="0"
					class="btnScissors"
					style="width: 100px"
				/>
				<label>가위</label>
			</div>
			<div class="wrapper">
				<input
					type="button"
					id="btnRock"
					value="1"
					class="btnRock"
					style="width: 100px"
				/>
				<label>바위</label>
			</div>
			<div class="wrapper">
				<input
					type="button"
					id="btnPaper"
					value="2"
					class="btnPaper"
					style="width: 100px"
				/>
				<label>보</label>
			</div>
		</div>

		<div class="resultArea" style="margin-top: 40px">
			<span>승패여부는 여기에!!</span>
		</div>

		<script>
			/** TODO: 여기에 게임이 작동될 수 있도록 스크립트를 짜보세요  */

			// 0: 가위, 1: 바위, 2: 보
			const choiceList = ['0', '1', '2'];
			let gameResult = ''

			// 랜덤으로 가위바위보 지정하기
			const getGameResult = () => {
					gameResult = choiceList.sort(() => Math.random() - 0.5)[0];
			}

			// 게임시작!
			const startGame = (userInput) => {
					if (gameResult === ''){
						updateMessageArea('게임시작을 눌러주세요!') 
						return;
					}

					if (userInput === gameResult) { // 비겼을때
						updateMessageArea(`비겼습니다`)
						getGameResult()
						return;
					}

					// 번호를 비교해서 졌을 때. -> 번호가 크거나, 사용자-보, 컴퓨터-가위
					if ((gameResult > userInput) || (userInput === '2' && gameResult === '0')) {
						updateMessageArea(`졌다! ` )
					} else {
						updateMessageArea(`이겼다!` )
					}
					getGameResult()
			}

			// 결과 부분 그리기
			let resultArea = document.querySelector('.resultArea');
			const updateMessageArea = (message) => {
				const messageArea = document.createElement('p')
				messageArea.innerHTML = `${message}`
				resultArea.append(messageArea)
			}
			
			// 시작버튼 눌렀을때 
			let setPrsSubmit = document.querySelector('.setPrsSubmit')
			setPrsSubmit.addEventListener('click', () => {
					getGameResult();
			})

			// 가위바위보 버튼 눌렀을 때
			let elementNameList = ['btnScissors', 'btnRock', 'btnPaper'];
			elementNameList.forEach((element) => {
				let el = document.querySelector(`.${element}`)
				el.addEventListener('click', (e) => {
					startGame(e.target.value)  // value 전달
				})
			})

			// let btnScissors = document.querySelector('.btnScissors')
			// btnScissors.addEventListener('click', (e) => {
			// 	startGame(e.target.value)
			// })
			// let btnRock = document.querySelector('.btnRock')
			// btnRock.addEventListener('click', (e) => {
			// 	startGame(e.target.value)
			// })
			// let btnPaper = document.querySelector('.btnPaper')
			// btnPaper.addEventListener('click', (e) => {
			// 	startGame(e.target.value)
			// })

		</script>
	</body>
</html>
