<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />

		<title>구구단 게임</title>

		<style>
			body {
				width: 50%;
				max-width: 800px;
				min-width: 480px;
				margin: 0 auto;
			}
		</style>
	</head>

	<body>
		<h1>구구단 게임</h1>

		<li style="margin-bottom: 5px">
			랜덤값으로 지정할 수 있는 최대 자릿수는 3입니다.
		</li>
		<li style="margin-bottom: 5px">
			자릿수를 등록하면 해당 자릿수 크기의 숫자 2개가 랜덤으로 표시
			됩니다.
		</li>
		<li style="margin-bottom: 5px">
			랜덤으로 표시되는 2개 숫자의 곱셈값을 기록하세요.
		</li>
		<div class="setDigitForm">
			<label for="setDigitNum">자릿수를 설정해주세요: </label>
			<input type="text" id="setDigitNum" class="setDigitNum" onkeyup="window.event.keyCode === 13 ? checkDigitNumber() : ''" />
			<input type="submit" value="등록" class="setDigitSubmit" />
		</div>

		<div class="form" style="margin-top: 40px">
			<span id="randA">랜덤값A</span> X <span id="randB">랜덤값B</span> =
			<input type="text" id="guessField" class="guessField" onkeyup="window.event.keyCode === 13 ? checkUserInput() : ''" />
			<input type="submit" value="정답확인" class="guessSubmit" />
		</div>

		<div class="resultArea" style="margin-top: 40px">
			<span>정답여부는 여기에!!</span>
		</div>

		<script>
			let result = 0;
			let guessField = document.querySelector('#guessField')

			/**
			 * 자릿수 입력여부 체크하기
			 */
			const checkDigitNumber = () => {
				let setDigitNum = document.querySelector('#setDigitNum').value; // 자릿수 입력 input
				let elRandA = document.querySelector('#randA'); // 숫자 A 
				let elRandB = document.querySelector('#randB'); // 숫자 B

				// 자릿수 지정 안했을때 
				if (setDigitNum === ''){
					updateResultTxt('값을 입력해주세요');
					return; 
				}

				// 자릿수 지정범위 이외의 값을 입력했을 때
				if (isNaN(setDigitNum) || setDigitNum <= 0 || setDigitNum > 3){
					updateResultTxt('1부터 3이하의 숫자를 입력해주세요.');
					return; 
				}

				// 자릿수 이상 없으면 랜덤숫자 지정
				elRandA.innerHTML = getRandomNumber(setDigitNum);
				elRandB.innerHTML = getRandomNumber(setDigitNum);

				// 랜덤 숫자 값을 정해서 정답 선언
				result = elRandA.innerHTML * elRandB.innerHTML;

				// 자릿 수 입력 후, 정답란으로 focus 이동
				guessField.focus()
			}
			
			/**
			 *  답이 맞는지 체크하기
			 */
			const checkUserInput = () => {
					let guessFieldValue = guessField.value; // 사용자 입력 영역 입력값

					// 정해진 답과, 사용자 입력값이 일치할 때
					if (result == guessFieldValue) { 
						updateResultTxt('정답!')

						// 1초 뒤 다시 랜덤 숫자 지정하기
						setTimeout(() => {
							checkDigitNumber();
						}, 1000)
						
					} else {
						updateResultTxt('오답 ㅠㅠ')
					}
			}

			/**
			 *  정답결과 보여주기
			 *  @param {String} text - 보여줄 메시지
			 */
			const updateResultTxt = (text) => {
				let resultArea = document.querySelector('.resultArea');
				resultArea.innerHTML = `<span>${text}</span>`
			}

			/**
			 * 랜덤숫자 지정하기
			 * @param {Number} numberLength - 자릿수
			 */
			const getRandomNumber = (numberLength) => {
				let minNum = (10 ** numberLength) / 10;  // (10을 자릿수만큼 제곱근 / 10)
				let maxNum = minNum * 10;

				return Math.floor(Math.random() * (maxNum - minNum)) + minNum
			}
			
			// 자리수를 설정해주세요 버튼을 클릭했을때.
			let setDigitSubmit = document.querySelector('.setDigitSubmit');
			setDigitSubmit.addEventListener('click', () => {
				checkDigitNumber()
			})
			
			// TODO: input 입력후 버튼 눌렀을 때 -> 이거 엔터키도 추가해놓기.
			let guessSubmit = document.querySelector('.guessSubmit');
			guessSubmit.addEventListener('click', () => {
				checkUserInput();
			})
			
		</script>
	</body>
</html>
