<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<link rel="stylesheet" href="./desktop.css">
		<script src="./desktop.js"></script>
	</head>
	<body>
		<section class="desktop">
			<div class="wrap">
				<h4 class="text_msg">바탕화면 +_+</h4>

				<div>
					<label>폴더 갯수</label>
					<input type="text" class="makeFolder" />
				</div>
				<div>
					<label>아이콘 갯수</label>
					<input type="text" class="makeIcon" />
				</div>
				<input type="submit" value="바탕화면 만들기" class="makeWindow" />
			</div>
			
		</section>

		<script>
			let makeWindow = document.querySelector('.makeWindow')
			let myDesktop = new Desktop('makeFolder', 'makeIcon');

			makeWindow.addEventListener('click', () => {
				myDesktop.updateWindowInfo();
			})

			/**
			 * z-index 확인하기
			 * 폴더가 여러개 있을 때 시작 위치에 변동을 줄 수 있는지
			 * 드래그 & 드롭 컨트롤 되는 범위가 제한이 되는지?
			 * 클릭 여러개 했을 때 폴더가 여러개 생기는 현상
			 * 주석 많이 달기
			 * 활성화된 ID 목록을 가지고 있으면 zindex랑 삭제 버튼 기능을 만드는데 도움이 될꺼야
			 * input 누르고 엔터 누르면 바로 동작이 될 수 있게 해조라
			 * 드래그 해서 아이콘을 이동시키는데, z-index도 올려줘라
			 * 
			 */
		</script>
	</body>
</html>
