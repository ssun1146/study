<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<link rel="stylesheet" href="./bingoGame.css">
		<script src="./bingoGame.js"></script>
	</head>
	<body>
		<p class="bingo__message"> 1~25사이 숫자를 빈칸에 입력한 후 게임 시작을 눌러주세요 </p>
		<div class="wrap">
			<div class="board">
				<div class="board__title">내꺼 +_+</div>
				<div class="board-user">
					<div class="row">
						<input type="text" class="col" />
						<input type="text" class="col" />
						<input type="text" class="col" />
						<input type="text" class="col" />
						<input type="text" class="col" />
					</div>
					<div class="row">
						<input type="text" class="col" />
						<input type="text" class="col" />
						<input type="text" class="col" />
						<input type="text" class="col" />
						<input type="text" class="col" />
					</div>
					<div class="row">
						<input type="text" class="col" />
						<input type="text" class="col" />
						<input type="text" class="col" />
						<input type="text" class="col" />
						<input type="text" class="col" />
					</div>
					<div class="row">
						<input type="text" class="col" />
						<input type="text" class="col" />
						<input type="text" class="col" />
						<input type="text" class="col" />
						<input type="text" class="col" />
					</div>
					<div class="row">
						<input type="text" class="col" />
						<input type="text" class="col" />
						<input type="text" class="col" />
						<input type="text" class="col" />
						<input type="text" class="col" />
					</div>
				</div>
			</div>
			<div class="board">
				<div class="board__title">컴퓨터 빙고판</div>
				<div class="board-computer"></div>
			</div>
		</div>
		<div class="bottom">
			<button class="btn-game_start">게임 시작</button>
			<button class="btn-random">랜덤 빙고 만들기</button>
		</div>
	</body>

	<script>
		let isBingoRandom = false
		let bingo = new bingoGame(isBingoRandom);


		let startBingoGame = document.querySelector('.btn-game_start');
		startBingoGame.addEventListener('click', () => {
			isBingoRandom = false // true면 빙고판 변경이 있을 수 있어서 false 보내주기
			bingo.createBingoGame(isBingoRandom);
		})
		
		let randomBingoBoard = document.querySelector('.btn-random');
		randomBingoBoard.addEventListener('click', () => {
			isBingoRandom = true
			bingo.createBingoGame(isBingoRandom);
		})
	</script>



</html>
